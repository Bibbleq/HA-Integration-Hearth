override:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    duration:
      selector:
        duration:
recompute:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    force:
      default: true
      selector:
        boolean:
refresh_forecast:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
set_schedule:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    schedule:
      required: true
      selector:
        object:
reset_learning:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    bucket:
      selector:
        select:
          options:
            - preheat_shortfall
            - slope_error
            - skip_failure
            - baseline_error
            - warming_rate
export_learning:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    parts:
      selector:
        select:
          multiple: true
          options:
            - warming_rate
            - ledger
            - running_mean
import_learning:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
    data:
      required: true
      selector:
        object:
    parts:
      selector:
        select:
          multiple: true
          options:
            - warming_rate
            - ledger
            - running_mean
undo_reset:
  fields:
    entry_id:
      selector:
        config_entry:
          integration: hearth
    vtherm_entity_id:
      selector:
        entity:
          domain: climate
